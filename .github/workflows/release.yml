name: Release

# Builds Fennec F-Droid from the fennecbuild recipe (all of Firefox from
# source), signs the unsigned APK and publishes a GitHub release, then
# dispatches the custom F-Droid repo to pick it up.
#
# Free & unlimited on this public repo (standard ubuntu-latest runners).
# Build output goes straight to the console (STDOUT/STDERR) — no log files.
# The console IS the record; a background heartbeat pushes only disk/memory
# state to the `ci-logs` branch so a runner reclaimed mid-build leaves
# something to read.

on:
  # Every push to master starts a full build. (The repo PAT can push but 403s on
  # workflow_dispatch — no admin scope — so the push trigger is the reliable trigger.)
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName"
        required: false
        default: "155.0.0"
      version_code:
        description: "versionCode (scheme XYZAR; R = revision)"
        required: false
        default: "1550022"

env:
  ANDROID_HOME: /usr/lib/android-sdk
  # The runner image bakes ANDROID_SDK_ROOT=/usr/local/lib/android/sdk into its
  # env. Pin both to the same directory (F-Droid uses one root); AGP is
  # fussy about the two pointing at different SDK roots.
  ANDROID_SDK_ROOT: /usr/lib/android-sdk
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ci_heartbeat.sh pushes a small disk/memory state file to the `ci-logs`
    # branch using the job's GITHUB_TOKEN. Without this the token is read-only
    # by default and every push is a silent 403. It writes no files to the
    # workspace; the build's own output goes to the console only.
    permissions:
      contents: write
    # One build at a time: parallel runs save to the same cache keys and clobber
    # each other (2026-09-20: two overlapping runs, both cache saves looked OK,
    # the next run's restores still missed). Extra pushes queue instead.
    concurrency:
      group: fennec-build
      cancel-in-progress: false
    steps:
      - name: Checkout fennecbuild
        uses: actions/checkout@v4

      - name: Disk checkpoint 0
        run: |
          echo "=== df (start) ==="; df -h / /home; free -h; nproc

      - name: Install build dependencies (mirrors fdroiddata sudo block)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make m4 pkg-config python-is-python3 \
            python3-venv tcl gyp ninja-build bzip2 libffi-dev libsqlite3-dev \
            binutils-dev clang lld libssl-dev zlib1g-dev nodejs terser rustup
          df -h /

      - name: Java 17
        run: |
          ls /usr/lib/jvm/
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version

      - name: Restore tools caches (gradle dists, rust, cargo)
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/gradle-versions
            ~/.cargo
            ~/.rustup
          # static keys: every input is pinned to an exact commit/version, so
          # the caches stay valid until a pin changes (bump the key suffix then)
          key: fennec-tools-v1

      - name: Gradle (version-aware shim, mirrors F-Droid's per-project wrapper)
        run: |
          # F-Droid does not pin one Gradle globally: each project's build runs on
          # its own gradle-wrapper.properties version (glean/app-services 8.14.3,
          # geckoview/fenix 9.7.0). A single global version can break a project
          # whose AGP relies on Gradle internals removed in newer releases.
          # Replicate F-Droid: a shim that reads the current project's wrapper
          # and uses that version.
          install -m 0755 .github/workflows/gradle-wrapper.sh /usr/local/bin/gradle
          echo "which gradle -> $(command -v gradle)"
          cat /usr/local/bin/gradle | head -5

      - name: Rust 1.95.0
        run: |
          rustup default 1.95.0
          rustc --version

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/lib/android-sdk
          key: fennec-sdk-r29-37.0-37.1-v1

      - name: Android SDK components (NDK r29, platform, build-tools)
        run: |
          set -e
          # Locate an existing sdkmanager; the runner's cmdline-tools layout varies
          SM=""
          for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/bin/sdkmanager; do
            [ -x "$c" ] && SM="$c" && break
          done
          if [ -z "$SM" ]; then
            echo "cmdline-tools not found; installing (same component + checksum fennecbuild build.sh uses)"
            curl --silent -O https://dl.google.com/android/repository/commandlinetools-linux-15641748_latest.zip
            echo 'a66d5ef0238fc0162e9c1446602ce0dd41702d4dd7a94d2ce42d12b7f80baf7e  commandlinetools-linux-15641748_latest.zip' | sha256sum -c -
            unzip -q commandlinetools-linux-15641748_latest.zip -d /tmp/clt
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools/21.0"
            sudo cp -r /tmp/clt/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/21.0/"
            SM="$ANDROID_HOME/cmdline-tools/21.0/bin/sdkmanager"
          fi
          echo "sdkmanager: $SM"
          # The runner's /usr/lib/android-sdk is root-owned: sdkmanager (running as
          # 'runner') cannot persist license acceptance or install properties there
          # ("Failed to read or create install properties file") and re-prompts mid-install.
          # Make the SDK root writable by the current user first.
          sudo chown -R "$USER" "$ANDROID_HOME"
          # put sdkmanager on PATH (build.sh calls bare `sdkmanager`)
          echo "$(cd "$(dirname "$SM")" && pwd)" >> "$GITHUB_PATH"
          # Accept licenses (non-interactive now that the dir is writable)
          yes | "$SM" --licenses
          # Install the components (no prompt expected; keep 'yes' as belt-and-braces)
          yes | "$SM" "ndk;29.0.14206865" "platforms;android-35" "platforms;android-36" "platforms;android-36.1" "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          # hard check: fail loudly if anything is actually missing
          for d in platforms/android-37.1 platforms/android-35 platforms/android-36 build-tools/37.0.0 ndk/29.0.14206865 platform-tools; do
            [ -d "$ANDROID_HOME/$d" ] || { echo "MISSING $ANDROID_HOME/$d"; ls -la "$ANDROID_HOME"; exit 1; }
          done
          echo "installed platforms:"; ls "$ANDROID_HOME/platforms"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          df -h /

      - name: Clone srclibs (pinned, shallow; 3x retry — shared-runner network flakes)
        run: |
          set -e
          SIB=..
          mkdir -p "$SIB/srclib"
          # Run #33 lost 3 of 5 attempts to transient clone failures (exit 128);
          # retry with backoff instead of burning the whole attempt budget.
          gclone() { # <url> <ref> <dest>
            local i
            for i in 1 2 3; do
              if git clone --depth 1 --branch "$2" "$1" "$3"; then return 0; fi
              echo "clone of $3 failed (attempt $i/3), retrying in $((i*30))s"
              rm -rf "$3"
              sleep $((i*30))
            done
            echo "FATAL: clone of $3 failed 3 times"
            return 1
          }
          echo "=== MozFennec (mozilla-central @ FIREFOX-ANDROID_155_0_RELEASE)"
          gclone https://github.com/mozilla-firefox/firefox FIREFOX-ANDROID_155_0_RELEASE "$SIB/srclib/MozFennec"
          df -h /
          echo "=== MozAppServices @ v155.0 (+submodules)"
          gclone https://github.com/mozilla/application-services v155.0 "$SIB/srclib/MozAppServices"
          (cd "$SIB/srclib/MozAppServices" && git submodule update --init --depth 1)
          df -h /
          echo "=== Glean (v68.0.1 / v68.0.0)"
          gclone https://github.com/mozilla/glean v68.0.1 "$SIB/srclib/MozGlean"
          gclone https://github.com/mozilla/glean v68.0.0 "$SIB/srclib/MozGleanAS"
          echo "=== UnifiedPushAC @ 1.0.6"
          gclone https://gitlab.com/ironfox-oss/unifiedpush-ac 1.0.6 "$SIB/srclib/UnifiedPushAC"
          echo "=== wasi-sdk @ wasi-sdk-20 (+submodules)"
          gclone https://github.com/WebAssembly/wasi-sdk wasi-sdk-20 "$SIB/srclib/wasi-sdk"
          (cd "$SIB/srclib/wasi-sdk" && git submodule update --init --depth 1)
          df -h /
          echo "=== llvm @ 3b5e7c83 (llvm-project commit)"
          git init "$SIB/srclib/llvm"
          (cd "$SIB/srclib/llvm" && \
            git remote add origin https://github.com/llvm/llvm-project && \
            git fetch --depth 1 origin 3b5e7c83a6e226d5bd7ed2e9b67449b64812074c && \
            git checkout -q FETCH_HEAD)
          df -h /
          echo "=== llvm_android @ e727bfb0 (full clone: googlesource SHA checkout)"
          git clone https://android.googlesource.com/toolchain/llvm_android "$SIB/srclib/llvm_android"
          (cd "$SIB/srclib/llvm_android" && git checkout -q e727bfb014bd436f581a66a450c939a6983a1fc3)
          echo "=== toolchain-utils @ dd1ee45a (full clone: googlesource SHA checkout)"
          git clone https://android.googlesource.com/platform/external/toolchain-utils "$SIB/srclib/toolchain-utils"
          (cd "$SIB/srclib/toolchain-utils" && git checkout -q dd1ee45a84cb07337f9d5d0a6769d9b865c6e620)
          df -h /
          echo "=== srclib sizes ==="
          du -sh "$SIB"/srclib/*
          # Absolute path to the srclib dir, for the cache steps below.
          # actions/cache rejects '..' in `path` (and resolves relative paths
          # against the workspace, which is why '../srclib/...' failed), so we
          # hand it an absolute path instead.
          echo "SRCLIB_DIR=$(cd "$SIB/srclib" && pwd)" >> "$GITHUB_ENV"

      - name: prebuild.sh (patches + configure)
        run: |
          chmod +x prebuild.sh build.sh
          echo "gradle used by mozconfig: $(command -v gradle)"
          # inputs.* are empty on push-triggered runs (defaults apply to
          # workflow_dispatch only) — fall back to the release version.
          ./prebuild.sh "${{ inputs.version_name || '155.0.0' }}" "${{ inputs.version_code || '1550022' }}"
          df -h /

      - name: Compute unit-test fingerprint
        # The cache key for the unit-test results: commit + release version +
        # the patched-tree hash of the test sources. ANY of those changing
        # (source patch, srclibs pin edit, version bump) produces a new
        # fingerprint, so cached test results can never be reused for
        # different inputs. Consumed by "Run unit tests (fingerprint gate)"
        # in phase 3.
        id: tfp
        run: |
          chmod +x .github/workflows/test_fingerprint.sh
          FINGERPRINT=$(bash .github/workflows/test_fingerprint.sh "${{ inputs.version_name || '155.0.0' }}" "${{ inputs.version_code || '1550022' }}")
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "unit-test fingerprint: ${FINGERPRINT}"

      - name: Pin source mtimes (deterministic snapshot for incremental restores)
        run: |
          # Fresh-cloned sources carry mtime=now and the patch step just wrote
          # new files, while a restored obj/ keeps its ORIGINAL build mtimes
          # (actions/cache preserves them). With sources newer than the
          # restored artifacts, cargo/ninja/autoconf treat EVERYTHING as dirty:
          # runs #30-33 showed 874 'Compiling' / 0 'Fresh' crates per segment
          # and a 20s re-configure (config.status stale) — the checkpoint
          # chain never advanced past the first ~377 rust crates. Pin every
          # source file to a fixed timestamp OLDER than any real build, so a
          # restored obj/ is always strictly newer than its inputs and
          # resumes incrementally. Must run AFTER prebuild (patches modify the
          # source tree) and BEFORE the phase-3 restores below.
          SNAP=$(date -d '2026-09-01 00:00:00 UTC' +%s)
          for d in "$SRCLIB_DIR/MozFennec" "$SRCLIB_DIR/MozAppServices"; do
            [ -d "$d" ] || continue
            echo "pinning mtimes under $d -> @${SNAP}"
            # Whole tree, dirs included: a restored obj/target lands here AFTER
            # this step and its artifacts keep their original (newer) build
            # mtimes, so nothing pinned is ever newer than a real artifact.
            find "$d" -depth -exec touch -h -d "@${SNAP}" {} + 2>/dev/null || true
          done
          # Sanity: a pinned source must be strictly older than build time.
          NEW=$(date +%s)
          [ "$SNAP" -lt "$NEW" ] && echo "SNAP=${SNAP} < now=${NEW}: OK"

      - name: Restore LLVM toolchain (if cached from a previous run)
        id: llvm-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SRCLIB_DIR }}/llvm/out
          key: fennec-llvm-out-3b5e7c83-v1

      - name: Restore WASI toolchain (if cached from a previous run)
        id: wasi-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SRCLIB_DIR }}/wasi-sdk/build/install/wasi
          key: fennec-wasi-out-v1

      - name: Build LLVM toolchain (or restore from cache)
        run: |
          bash .github/workflows/ci_heartbeat.sh "$GITHUB_WORKSPACE" &
          echo $! > "$GITHUB_WORKSPACE/heartbeat.pid"
          .github/workflows/build-llvm.sh
          rc=$?
          kill "$(cat "$GITHUB_WORKSPACE/heartbeat.pid")" 2>/dev/null || true
          echo "=== df (after LLVM) ==="; df -h /
          exit "$rc"

      - name: Save LLVM toolchain cache (right after the LLVM phase completes)
        run: |
          OUT=../srclib/llvm/out
          if [ ! -e "$OUT/CI_DONE" ]; then echo "no CI_DONE marker — not saving"; exit 0; fi
          if [ ! -d "$OUT" ]; then echo "LLVM out dir missing — not saving"; exit 0; fi
          b=$(du -sb "$OUT" 2>/dev/null | awk '{print $1}')
          if [ -z "$b" ]; then
            b=$(( $(du -sk "$OUT" 2>/dev/null | awk '{print $1}' || echo 0) * 1024 ))
          fi
          gb=$(awk -v b="${b:-0}" 'BEGIN{printf "%.1f", b/1073741824}')
          if awk -v g="$gb" 'BEGIN{exit !(g < 9.5)}'; then
            echo "LLVM out = ${gb} GB — saving cache"
            echo "LLVM_OUT=1" >> "$GITHUB_ENV"
          else
            echo "LLVM out = ${gb} GB — skipping save (>= 9.5 GB cache limit)"
          fi
          exit 0
      - name: Cache LLVM out
        # Only a run that BUILT LLVM (restore missed the cache) saves it.
        # A run that restored the cache re-saving the same static key is a
        # no-op collision ("Unable to reserve cache ...") — never do it.
        # No continue-on-error: a save of a COMPLETED artefact that fails
        # is a hard error, not a warning.
        if: env.LLVM_OUT == '1' && steps.llvm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SRCLIB_DIR }}/llvm/out
          key: fennec-llvm-out-3b5e7c83-v1

      - name: Build WASI SDK (or restore from cache)
        run: |
          bash .github/workflows/ci_heartbeat.sh "$GITHUB_WORKSPACE" &
          echo $! > "$GITHUB_WORKSPACE/heartbeat.pid"
          .github/workflows/build-wasi.sh
          rc=$?
          kill "$(cat "$GITHUB_WORKSPACE/heartbeat.pid")" 2>/dev/null || true
          echo "=== df (after WASI) ==="; df -h /
          exit "$rc"

      - name: Save WASI toolchain cache (right after the WASI phase completes)
        run: |
          OUT=../srclib/wasi-sdk/build/install/wasi
          if [ ! -e "$OUT/CI_DONE" ]; then echo "no CI_DONE marker — not saving"; exit 0; fi
          if [ ! -d "$OUT" ]; then echo "WASI install dir missing — not saving"; exit 0; fi
          b=$(du -sb "$OUT" 2>/dev/null | awk '{print $1}')
          if [ -z "$b" ]; then
            b=$(( $(du -sk "$OUT" 2>/dev/null | awk '{print $1}' || echo 0) * 1024 ))
          fi
          gb=$(awk -v b="${b:-0}" 'BEGIN{printf "%.1f", b/1073741824}')
          if awk -v g="$gb" 'BEGIN{exit !(g < 9.5)}'; then
            echo "WASI install = ${gb} GB — saving cache"
            echo "WASI_OUT=1" >> "$GITHUB_ENV"
          else
            echo "WASI install = ${gb} GB — skipping save (>= 9.5 GB cache limit)"
          fi
          exit 0
      - name: Cache WASI out
        # Only a run that BUILT the WASI SDK (restore missed the cache)
        # saves it; re-saving a restored static key is a no-op collision.
        # No continue-on-error: a failed save of a COMPLETED artefact is a
        # hard error, not a warning.
        if: env.WASI_OUT == '1' && steps.wasi-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SRCLIB_DIR }}/wasi-sdk/build/install/wasi
          key: fennec-wasi-out-v1

      # ---- Phase 3: resumable stages --------------------------------------
      # Phase 3 used to be ONE build-rest.sh step; when the shared
      # ubuntu-latest runner was recycled mid-phase ("The runner has received a
      # shutdown signal", exit 143) everything after the last cache was lost.
      # It is now five sequential stages (same order as build-rest.sh, via
      # STAGES= filtering).
      #
      # CACHE DESIGN (2026-09-27): STABLE KEYS, saved once, restored forever.
      # actions/cache entries are IMMUTABLE — a key can never be overwritten —
      # and the repo has ONE 10 GB budget across all entries with LRU eviction
      # of the oldest. The old per-run checkpoint keys (run_id+attempt+stage)
      # wrote ~35 GB per run (six ~5 GB obj snapshots, five ~1.75 GB deps
      # snapshots), so the toolchains saved early in the run were the ones
      # evicted every time (runs 36283481652/36301378409: LLVM+WASI re-built
      # cold each run, ~4.5 h). Now:
      #   fennec-p3-obj-v1   — obj+target, saved ONCE after the completion
      #                        gate (the first run to reach it wins; later
      #                        saves no-op against the immutable key).
      #   fennec-p3-deps-v1  — m2+gradle, saved ONCE after 3e.
      # Both fall back to the legacy per-run prefixes on restore, so the
      # first stable-key run can still pick up a completed state from the
      # old-era entries. Sources are mtime-pinned on a fixed branch, so a
      # saved state stays valid until the source changes — then bump the key
      # suffix (v1 -> v2) to rotate deliberately. Steady-state footprint:
      # LLVM ~0.6 + WASI ~0.1 + obj ~5.3 + deps < 3.0 ≈ < 9 GB (cap 10 GB).
      - name: Restore phase-3 caches (mavenLocal, gradle home)
        id: deps-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle
          key: fennec-p3-deps-v1
          restore-keys: |
            fennec-p3-deps-v1-
            fennec-p3-deps-v1
      - name: Restore phase-3 build dirs (incremental compile)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SRCLIB_DIR }}/MozFennec/obj
            ${{ env.SRCLIB_DIR }}/MozAppServices/target
          key: fennec-p3-obj-v1
          restore-keys: |
            fennec-p3-obj-v1
            fennec-p3-build-v1-
            fennec-p3-build-v1
      - name: Build heartbeat
        run: |
          bash .github/workflows/ci_heartbeat.sh "$GITHUB_WORKSPACE" &
          echo $! > "$GITHUB_WORKSPACE/heartbeat.pid"

      - name: Publish CBOR + Glean to mavenLocal
        id: p3a
        run: bash .github/workflows/run_p3_stage.sh "cbor glean glean_as" p3a

      # ---- P3b1: the gecko build as logical build steps -------------------
      # mach build's own phases, each one workflow step that runs until it
      # is complete (rc=0) — NO time budgets anywhere: the build decides
      # when a step is done. Only the state AFTER the completion gate is
      # cached (one stable-key save below); the per-tier saves from the
      # crash-checkpoint era are gone (they churned ~30 GB/run and evicted
      # the toolchain caches — see the CACHE DESIGN note above). On a
      # restore hit every tier re-executes as a fast up-to-date no-op,
      # because the sources are mtime-pinned and ninja/cargo skip
      # already-built files.
      #
      # The steps are the tiers mach build itself runs, in order:
      #   1. pre-export   — files generated before export
      #   2. export       — files generated before compile
      #   3. pre-compile  — files generated during compile
      #   4. binaries     — compile+link all C/C++/Rust (the long one)
      #   5. faster       — JS/XUL/CSS etc. (complements binaries)
      #   6. (vanilla)    — remaining tiers; the completion gate
      - name: Stop Gradle daemons (free RAM for rust codegen)
        # The P3a gradle builds (glean) leave JVM daemons behind:
        # run 36274687731 showed java at 3.1-3.9 GiB still resident when
        # the binaries tier started rust codegen — 12 GiB of the 15 GiB
        # machine was used at the geckoservo codegen peak, swap engaged,
        # and the runner then killed the job (its own agent starved).
        # The mach tiers need no gradle; stop the daemons so the peak
        # has ~4 GiB more headroom. (The later gecko_gv stage starts its
        # own fresh daemon — unaffected.)
        run: |
          before=$(ps -eo rss=,comm= 2>/dev/null | awk '$2=="java"{s+=$1} END{printf "%dMiB", s/1024}')
          echo "java RSS before: ${before:-0MiB}"
          gradle --stop 2>/dev/null || true
          for p in $(pgrep -f "GradleDaemon" 2>/dev/null); do
            echo "stopping gradle daemon pid $p"
            kill "$p" 2>/dev/null || true
          done
          sleep 5
          after=$(ps -eo rss=,comm= 2>/dev/null | awk '$2=="java"{s+=$1} END{printf "%dMiB", s/1024}')
          echo "java RSS after: ${after:-0MiB}"
          free -h | head -2

      - name: Gecko build — pre-export
        # Generate everything the export tier needs. Short step.
        env:
          MACH_BUILD_TARGETS: "pre-export"
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-pe

      - name: Gecko build — export
        # Generate everything the compile tier needs (JS bundles, headers, ...).
        env:
          MACH_BUILD_TARGETS: "export"
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-exp

      - name: Gecko build — pre-compile
        # Generate everything needed DURING the compile.
        env:
          MACH_BUILD_TARGETS: "pre-compile"
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-prec

      - name: Stop Gradle daemons (free RAM for rust codegen)
        # pre-export/export/pre-compile start fresh gradle daemons (java at
        # ~3 GiB by the time binaries starts in run 36279268007). The rust
        # tiers need none of them — stop them right before the peak.
        run: |
          before=$(ps -eo rss=,comm= 2>/dev/null | awk '$2=="java"{s+=$1} END{printf "%dMiB", s/1024}')
          echo "java RSS before: ${before:-0MiB}"
          gradle --stop 2>/dev/null || true
          for p in $(pgrep -f "GradleDaemon" 2>/dev/null); do
            kill "$p" 2>/dev/null || true
          done
          sleep 5
          after=$(ps -eo rss=,comm= 2>/dev/null | awk '$2=="java"{s+=$1} END{printf "%dMiB", s/1024}')
          echo "java RSS after: ${after:-0MiB}"
          free -h | head -2

      - name: Gecko build — binaries
        # Compile and link all C/C++/Rust sources — the long step.
        # No time limit: it runs until every object, crate and binary is built.
        # -j2 (2026-09-26): the machine has 15 GiB. With the small-memory
        # rust patch (no fat LTO, no codegen-units=1) a single rustc peaks at
        # a few GiB instead of 10.6, so two parallel rustc fit comfortably.
        # Serial (-j1) was the measurement baseline; raise further only if
        # the res_watch peak shows headroom.
        env:
          MACH_BUILD_TARGETS: "binaries"
          MACH_BUILD_JOBS: "2"
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-bin

      - name: Gecko build — faster
        # Everything binaries does not cover (JS, XUL, CSS, ...).
        # -j2: matches binaries; the rust is already built there, so this
        # tier is mostly frontend assets with low memory.
        env:
          MACH_BUILD_TARGETS: "faster"
          MACH_BUILD_JOBS: "2"
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-fast

      - name: Gecko build — completion gate
        # Vanilla mach build: remaining tiers (libs, misc, tools, syms)
        # — the gate that proves the whole gecko build is finished.
        run: bash .github/workflows/run_p3_stage.sh "gecko_build" p3b1-done

      - name: Gecko build obj guard (obj + target < 9 GB)
        id: ck-obj
        continue-on-error: true
        run: bash .github/workflows/ci_p3_guard.sh

      - name: Save gecko build dirs (STABLE key, once)
        # The single most expensive output (~5 GB obj). Saved ONCE under a
        # stable key: the first run to reach the gate wins, and because
        # actions/cache keys are immutable + the source is mtime-pinned on a
        # fixed branch, that state stays valid for every later run until the
        # source changes (then bump v1 -> v2). The AppServices target dir is
        # empty here (built in 3c) but is listed so the path/version hash
        # matches the restore exactly. continue-on-error: after the key
        # exists, every later save is a harmless no-op collision.
        #
        # WHY THE GATE (not 3c/3e): with one immutable key the save sits at
        # the boundary that minimizes worst-case redo given today's risk.
        # 3c (AppServices, 2-4 h) is the highest-risk stage right now; a
        # gate save means a 3c failure re-does only 3b2/3b3 (~10 min) + 3c,
        # never the 2 h gecko build. Once 3c/3d/3e are all proven, promote
        # this save to AFTER 3e (then even 3c becomes a no-op on re-runs)
        # — and bump the key suffix (v1 -> v2) at that moment.
        if: steps.ck-obj.conclusion == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.SRCLIB_DIR }}/MozFennec/obj
            ${{ env.SRCLIB_DIR }}/MozAppServices/target
          key: fennec-p3-obj-v1

      - name: Package Gecko (multi-locale)
        id: p3b2
        run: bash .github/workflows/run_p3_stage.sh "gecko_package" p3b2

      - name: Publish GeckoView to mavenLocal
        id: p3b3
        run: bash .github/workflows/run_p3_stage.sh "gecko_gv" p3b3

      - name: Restore unit-test results (fingerprint gate)
        # The result cache for the test gates below. Keyed on the source
        # fingerprint (commit + version + patched test-tree hash, computed
        # after prebuild): a hit means this exact source state already
        # passed the suites, and the gates will skip them. Any source or
        # version change = new fingerprint = no hit = full suites run
        # before any compile.
        id: tests-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.fennec-tests
          key: fennec-tests-v1-${{ steps.tfp.outputs.fingerprint }}

      - name: Test GeckoView (unit suite, fingerprint gate)
        # Runs :geckoview:testDebugUnitTest ONLY when the fingerprint
        # cache is missing. (AGP 9 removed the release variant unit-test
        # task; debug is the standard unit-test variant.) Covers the
        # CTAP2/CBOR wire-format tests (Ctap2CborTest) plus the geckoview
        # util tests. Needs obj/ (mozconfig + JNI), which exists from the
        # completion gate up — same state the publish step above used.
        run: |
          chmod +x .github/workflows/test_fingerprint_gate.sh
          bash .github/workflows/test_fingerprint_gate.sh gecko_gv "${{ steps.tfp.outputs.fingerprint }}"

      - name: Save GeckoView test results (fingerprint key, once)
        if: steps.tfp.outputs.fingerprint != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.fennec-tests
          key: fennec-tests-v1-${{ steps.tfp.outputs.fingerprint }}

      - name: Stop Gradle daemons (free RAM)
        run: bash .github/workflows/stop_gradle_daemons.sh

      - name: Build AppServices
        id: p3c
        run: bash .github/workflows/run_p3_stage.sh "ac_fetch150 appservices" p3c

      - name: Stop Gradle daemons (free RAM)
        run: bash .github/workflows/stop_gradle_daemons.sh

      - name: Build UnifiedPush + Android Components
        id: p3d
        run: bash .github/workflows/run_p3_stage.sh "upush ac" p3d

      - name: Test Fenix app (unit suite, fingerprint gate)
        # Runs :app:testDebugUnitTest (the full fenix unit suite) ONLY when
        # the fingerprint cache is missing. (AGP 9 removed the release
        # variant unit-test task; debug is the standard unit-test variant.) Placed after the AC publish and
        # BEFORE the fenix compile: the tests prove the source works before
        # 2.5 h of compilation is spent on it, and any failure fails the run
        # here, minutes into the build.
        run: |
          bash .github/workflows/test_fingerprint_gate.sh fenix "${{ steps.tfp.outputs.fingerprint }}"

      - name: Save Fenix test results (fingerprint key, once)
        # Markers under the fingerprint key: on a later run with the same
        # fingerprint the restore step restores them and both test gates skip
        # the suites entirely. Immutable key per fingerprint; first save wins.
        if: steps.tfp.outputs.fingerprint != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.fennec-tests
          key: fennec-tests-v1-${{ steps.tfp.outputs.fingerprint }}

      - name: Stop Gradle daemons (free RAM)
        # 3e is the heaviest gradle build in the pipeline (full Fenix Kotlin
        # app). Run 36335035837 died in 3e: res_watch showed 4 lingering
        # daemon JVMs (java 4597+3097+74… MiB), mem 9.6Gi used / 6.1Gi free,
        # heavy_build=0 (pure daemon bloat), then "runner lost communication
        # … starves it for CPU/Memory". This is the same fix that saved the
        # binaries tier — applied at every gradle stage boundary.
        run: bash .github/workflows/stop_gradle_daemons.sh

      - name: Build Fenix app (assembleRelease)
        id: p3e
        run: bash .github/workflows/run_p3_stage.sh "fenix" p3e

      - name: Save deps dirs (STABLE key, once)
        # mavenLocal + gradle home AFTER the final publish stage: the
        # complete superset of everything 3a-3e published. Same stable-key
        # pattern as the obj save above: first run to reach here wins,
        # later saves no-op against the immutable key. The obj/target dirs
        # are NOT included here (separate fennec-p3-obj-v1 key) so a big
        # obj save can't displace this one's budget.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle
          key: fennec-p3-deps-v1

      - name: Stop Phase 3 heartbeat
        if: always()
        run: |
          kill "$(cat "$GITHUB_WORKSPACE/heartbeat.pid")" 2>/dev/null || true
          echo "=== df (end) ==="; df -h /

      - name: Locate unsigned APK
        id: apk
        run: |
          set -e
          APKDIR=../srclib/MozFennec/obj/gradle/build/mobile/android/fenix/app/outputs/apk/release
          ls -la "$APKDIR"
          shopt -s nullglob
          # Fennec's release build is unsigned by default and is named
          # app-<abi>-release.apk (no "unsigned" suffix). Fallback keeps
          # the older app-*-release-unsigned.apk shape for safety.
          apks=("$APKDIR"/app-*arm64*release*.apk)
          [ ${#apks[@]} -gt 0 ] || apks=("$APKDIR"/app-*-release-unsigned.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "NO APK FOUND"; exit 1; }
          # arm64 for the Pixel 8a
          pick=""
          for a in "${apks[@]}"; do case "$a" in *arm64*) pick="$a";; esac; done
          [ -n "$pick" ] || pick="${apks[0]}"
          echo "apk=$pick" >> "$GITHUB_OUTPUT"
          echo "Picked: $pick"; ls -la "$pick"

      - name: Sign APK (permanent release key)
        if: steps.apk.outcome == 'success'
        env:
          FENNEC_KEYSTORE_BASE64: ${{ secrets.FENNEC_KEYSTORE_BASE64 }}
          FENNEC_STORE_PASS: ${{ secrets.FENNEC_STORE_PASS }}
          FENNEC_KEY_PASS: ${{ secrets.FENNEC_KEY_PASS }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/37.0.0"
          [ -x "$BT/apksigner" ] || { echo "apksigner missing"; ls "$BT"; exit 1; }
          echo "$FENNEC_KEYSTORE_BASE64" | base64 -d > fennec-release.jks
          UNSIGNED="${{ steps.apk.outputs.apk }}"
          SIGNED="Fennec-${{ inputs.version_code || '1550022' }}-${GITHUB_SHA::7}.apk"
          cp "$UNSIGNED" unsigned.apk
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks fennec-release.jks --ks-key-alias fennecrelease \
            --ks-pass "pass:$FENNEC_STORE_PASS" --key-pass "pass:$FENNEC_KEY_PASS" \
            --out "$SIGNED" aligned.apk
          "$BT/apksigner" verify --print-certs "$SIGNED"
          ls -la "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"
          echo "artifact=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK (artifact)
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fennec-signed
          path: ${{ env.SIGNED_APK }}

      - name: Publish GitHub release
        if: steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la Fennec-*.apk
          TAG="fennec-${{ inputs.version_name || '155.0.0' }}-${{ inputs.version_code || '1550022' }}"
          NOTES_FILE="$(mktemp)"
          {
            echo "Fennec F-Droid fork — Firefox ${{ inputs.version_name || '155.0.0' }} (versionCode ${{ inputs.version_code || '1550022' }})"
            echo ""
            echo "Built from haasanen/fennecbuild @ ${GITHUB_SHA}"
            echo "Same base as the official Fennec F-Droid build; signed with the fork's permanent release key."
          } > "$NOTES_FILE"
          gh release create "$TAG" "Fennec-"*.apk \
            --title "Fennec ${{ inputs.version_name || '155.0.0' }} (${{ inputs.version_code || '1550022' }})" \
            --notes-file "$NOTES_FILE" || \
          gh release upload "$TAG" "Fennec-"*.apk --clobber

      - name: Notify F-Droid repo (push trigger, fail-open)
        if: steps.apk.outcome == 'success'
        env:
          FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: |
          [ -z "${FDROID_DISPATCH_TOKEN:-}" ] && { echo "no dispatch token, skipping"; exit 0; }
          curl -sS -o /dev/null -w "dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $FDROID_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/haasanen/fdroid-repo/actions/workflows/update.yml/dispatches \
            -d '{"ref":"main"}' || true

      # Backstop: print GitHub's own failure record for this job to the
      # console on ANY job failure. Runner-level errors (lost communication /
      # CPU-mem starvation) live in the job's check-run annotations, not in
      # the step log — and a run whose runner died can lose the log blob
      # entirely (API: BlobNotFound), so the annotations are the durable
      # surface. The per-stage handler in run_p3_stage.sh prints it earlier,
      # at the failing stage; this covers non-stage steps too.
      - name: Surface the job's check-run annotations (on failure)
        if: failure()
        run: bash .github/workflows/ci_annotations.sh
