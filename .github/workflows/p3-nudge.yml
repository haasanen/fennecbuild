name: P3 Nudge

# Automatic resume of a failed/cancelled Release run via the Actions rerun API.
#
# WHY THIS REPLACED THE EMPTY-COMMIT NUDGE (the p3-retry-nudge job that used
# to live at the bottom of release.yml): pushing a nudge commit with
# GITHUB_TOKEN does NOT fire `on: push` workflows — documented GitHub
# anti-loop behaviour, and proven in this repo: the nudge push of a787bfd
# (2026-09-23 02:41Z) created no new run in 5+ hours. The chain never worked.
#
# `workflow_run` is the trigger that does fire here: it is not a push event,
# so the anti-loop rule does not apply, and it fires ~5 s after the watched
# workflow completes. The job then calls
#   POST /repos/haasanen/fennecbuild/actions/runs/{id}/rerun-failed-jobs
# which re-queues the failed `build` job ON THE ORIGINAL RUN as a new attempt.
# A new attempt re-runs every cache/restore step, so the build resumes from
# the newest p3 checkpoint cache (LLVM/WASI toolchain caches, then the last
# P3 stage-boundary checkpoint). No commits, no counter, no PAT secret.
#
# EMPIRICAL VALIDATION (2026-09-23, scratch workflows since deleted):
#   - listener fires ~5 s after the watched run completes;
#   - permissions: actions: write is sufficient (rerun-failed-jobs -> 201);
#   - the implicit GITHUB_TOKEN env var is EMPTY on this repo's runners
#     (401 on every call) — the token MUST be passed explicitly via
#     env: RUNNER_TOKEN: ${{ github.token }} (run 35842481284 vs 35842847817);
#   - full chain attempt 1 -> 2 -> 3 -> stop verified on run 35844257020;
#   - a successful run does NOT trigger the nudge job (if: filters it out).

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Verified: rerun-failed-jobs succeeds with Actions:write alone (no contents).
permissions:
  actions: write

jobs:
  nudge:
    # Only dead runs deserve a nudge. Note: no `needs:` here, so a plain job
    # `if` always evaluates on workflow_run events (no always() needed).
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CRITICAL: implicit GITHUB_TOKEN env is empty in run steps on this repo
    # (empirically 401 Bad credentials); pass the expression form explicitly.
    env:
      RUNNER_TOKEN: ${{ github.token }}
    concurrency:
      group: fennec-p3-nudge
      cancel-in-progress: false
    steps:
      - name: Upstream run summary
        env:
          UP_ID: ${{ github.event.workflow_run.id }}
          UP_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UP_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          echo "upstream: $UP_TITLE id=$UP_ID attempt=$UP_ATTEMPT conclusion=$UP_CONCLUSION sha=$UP_HEAD_SHA"

      - name: Rerun failed jobs with attempt cap 10
        env:
          UP_ID: ${{ github.event.workflow_run.id }}
          UP_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -e
          if [ "$UP_ATTEMPT" -ge 10 ]; then
            echo "CAP REACHED: run $UP_ID already attempted $UP_ATTEMPT times — not rerunning (manual inspection needed)"
            exit 0
          fi
          code=$(curl -sS -o rerun_resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/runs/${UP_ID}/rerun-failed-jobs")
          echo "rerun-failed-jobs: HTTP $code"
          cat rerun_resp.json
          [ "$code" = "201" ] || { echo "RERUN API FAILED with HTTP $code"; exit 1; }
          echo "OK: run $UP_ID re-queued as attempt $((UP_ATTEMPT + 1)) — build job will restore the newest checkpoint caches"
