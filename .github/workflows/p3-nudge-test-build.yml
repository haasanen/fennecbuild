name: P3NudgeTest

# SCRATCH workflow (test harness for the p3-nudge design — to be deleted).
# Simulates the long P3 build: waits ~20 s then fails (or succeeds, per the
# dispatch input) so the workflow_run listener in p3-nudge-test.yml can be
# exercised for both the failure and the success path.

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: "fail (triggers nudge) or succeed (must NOT trigger rerun)"
        required: false
        default: "fail"
        type: choice
        options:
          - fail
          - succeed

jobs:
  fake-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate P3b work then die
        run: |
          echo "fake-p3 starting at $(date -u +%H:%M:%SZ)"
          sleep 20
          if [ "${{ inputs.outcome }}" = "fail" ]; then
            echo "The runner has received a shutdown signal. (simulated exit 143)"
            exit 143
          fi
          echo "fake-p3 finished successfully"
