name: P3NudgeTest-nudge

# SCRATCH workflow (test harness for the p3-nudge design — to be deleted).
# Listens for P3NudgeTest runs completing; on failure (and while the run has
# fewer than 3 attempts) calls POST .../actions/runs/{id}/rerun-failed-jobs
# with the job's GITHUB_TOKEN. Verifies:
#   1. workflow_run fires on the failed sibling workflow,
#   2. the rerun-failed-jobs API accepts GITHUB_TOKEN with permissions.actions=write,
#   3. the run_attempt cap stops the chain after attempt 3,
#   4. a successful run does NOT get rerun.

on:
  workflow_run:
    workflows: ["P3NudgeTest"]
    types: [completed]

# The rerun API needs the Actions permission (actions: write), NOT contents.
permissions:
  actions: write

jobs:
  nudge:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # EMPIRICAL (P3Probe run 35842481284): the implicit GITHUB_TOKEN env var
    # is EMPTY on this repo's runners (every curl 401'd), while the explicit
    # '${{ github.token }}' expression works (rerun-failed-jobs -> 201).
    env:
      RUNNER_TOKEN: ${{ github.token }}
    steps:
      - name: Show upstream event summary
        env:
          UP_ID: ${{ github.event.workflow_run.id }}
          UP_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UP_NAME: ${{ github.event.workflow_run.name }}
          UP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "upstream name=$UP_NAME id=$UP_ID attempt=$UP_ATTEMPT conclusion=$UP_CONCLUSION sha=$UP_HEAD_SHA"

      - name: Dump full workflow_run event JSON
        env:
          EVENT_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          printf '%s\n' "$EVENT_JSON" > nudge_event.json
          wc -c nudge_event.json
          head -c 3000 nudge_event.json
          echo

      - name: Rerun failed jobs with attempt cap 3
        env:
          UP_ID: ${{ github.event.workflow_run.id }}
          UP_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -e
          if [ "$UP_ATTEMPT" -ge 3 ]; then
            echo "CAP REACHED: attempt $UP_ATTEMPT >= 3 — not rerunning (manual inspection needed)"
            exit 0
          fi
          code=$(curl -sS -o rerun_resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/runs/${UP_ID}/rerun-failed-jobs")
          echo "HTTP $code"
          cat rerun_resp.json
          [ "$code" = "201" ] || { echo "RERUN API FAILED with HTTP $code"; exit 1; }
          echo "rerun-failed-jobs accepted for run $UP_ID (was attempt $UP_ATTEMPT)"
