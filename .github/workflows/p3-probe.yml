name: P3Probe

# SCRATCH token-permission probe (to be deleted). Tests what the job's
# GITHUB_TOKEN can do on the Actions rerun/dispatch endpoints.

on:
  workflow_dispatch:
    inputs:
      target_run:
        description: "run id to try rerunning"
        required: true
        default: "35841743187"

permissions:
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # EMPIRICAL (2026-09-23): the implicit GITHUB_TOKEN env var was EMPTY in
    # run steps on this repo's runners (401 Bad credentials on every call),
    # while the token itself exists (log shows minted permissions). Pass the
    # expression form explicitly — this is the pattern release.yml already
    # uses for its gh/push steps.
    env:
      RUNNER_TOKEN: ${{ github.token }}
    steps:
      - name: Token presence
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then echo "GITHUB_TOKEN IS EMPTY"; else echo "GITHUB_TOKEN set, length=${#GITHUB_TOKEN}"; fi
          echo "prefix check (first 4 chars are 'ghs_' for a job token):"
          echo "${GITHUB_TOKEN:0:4}"

      - name: Self GET with GITHUB_TOKEN
        run: |
          code=$(curl -sS -o self.json -w '%{http_code}' \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/runs/$GITHUB_RUN_ID")
          echo "self-run GET: HTTP $code"; head -c 300 self.json; echo

      - name: POST rerun-failed-jobs with GITHUB_TOKEN
        run: |
          code=$(curl -sS -o rfj.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/runs/${{ inputs.target_run }}/rerun-failed-jobs")
          echo "rerun-failed-jobs: HTTP $code"; head -c 500 rfj.json; echo

      - name: POST full rerun with GITHUB_TOKEN
        run: |
          code=$(curl -sS -o rr.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/runs/${{ inputs.target_run }}/rerun")
          echo "full-rerun: HTTP $code"; head -c 500 rr.json; echo

      - name: POST workflow_dispatch with GITHUB_TOKEN
        run: |
          code=$(curl -sS -o wd.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/haasanen/fennecbuild/actions/workflows/p3-nudge-test-build.yml/dispatches" \
            -d '{"ref":"master","inputs":{"outcome":"succeed"}}')
          echo "workflow_dispatch: HTTP $code"; head -c 300 wd.json; echo
